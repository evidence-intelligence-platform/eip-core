name: EIP Core CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ai-engine-tests:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "ai-engine/requirements.txt"

      - name: Install AI Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-engine/requirements.txt

      - name: Run Pytest Test Suite
        env:
          LLM_MODEL_NAME: gemini-2.5-flash
          INTERNAL_API_KEY: eif-test-internal-api-key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ai-engine
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Production Build Test
        run: |
          cd frontend
          npm run build
