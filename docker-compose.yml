
services:
  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL Production Database Container
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eip_postgres
    restart: always
    environment:
      POSTGRES_DB: eip_db
      POSTGRES_USER: eip_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eip_user -d eip_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # Isolated Intelligence Zone & Core Zone (FastAPI + SQLModel)
  # ───────────────────────────────────────────────────────────────────────────
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: eip_ai_engine
    restart: always
    environment:
      DATABASE_URL: postgresql://eip_user:${POSTGRES_PASSWORD:?set it in .env}@postgres:5432/eip_db
      LLM_MODEL_NAME: gemini-2.5-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set it in .env}
      # NOTE: the engine reads JWT_SECRET_KEY (src/security/jwt.py) — the old
      # JWT_SECRET name was silently ignored.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set it in .env}
      # Optional integrations — all safely dormant when unset:
      # without RESEND_API_KEY e-mails are logged instead of sent; without
      # SENTRY_DSN error tracking is a no-op. FRONTEND_URL is where password
      # reset links point (the public site address in production).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────────────
  # Public Zone Frontend (Next.js 15)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eip_frontend
    restart: always
    environment:
      # Server-only vars consumed by the /api/eip proxy route; the internal
      # key never reaches the browser bundle anymore.
      EIP_API_URL: http://ai-engine:8080
      EIP_INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set it in .env}
      # Optional error tracking (no-op when empty). The NEXT_PUBLIC_ variant
      # is inlined at BUILD time, so for browser-side events in a compose
      # build it must also be passed as a build arg; server-side tracking
      # works with just this runtime var.
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3000:3000"
    depends_on:
      - ai-engine

volumes:
  postgres_data:
